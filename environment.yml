# environment.yml — Conda environment for QuantLib Pricing Platform
#
# SETUP:
#   conda env create -f environment.yml
#   conda activate quantlib-pricing
#
# UPDATE (after adding new dependencies):
#   conda env update -f environment.yml --prune

name: quantlib-pricing
channels:
  - conda-forge
  - defaults

dependencies:
  # --- Core ---
  - python=3.11
  - pip

  # --- QuantLib ---
  # conda-forge has pre-built QuantLib with all C++ deps resolved
  - quantlib-python>=1.31

  # --- Scientific ---
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.0

  # --- API & Web ---
  - fastapi>=0.104
  - uvicorn>=0.24
  - httpx>=0.25
  - pydantic>=2.0

  # --- Data ---
  - sqlalchemy>=2.0
  - redis-py>=5.0
  - pyarrow>=14.0       # Parquet support for MC output storage
  - openpyxl>=3.1        # Excel support

  # --- Config ---
  - pyyaml>=6.0
  - python-dotenv>=1.0

  # --- Logging ---
  - structlog>=23.2

  # --- Dev Tools ---
  - pytest>=7.4
  - pytest-cov>=4.1
  - pytest-asyncio>=0.21
  - hypothesis>=6.82
  - ruff>=0.1
  - mypy>=1.6
  - black>=23.9
  - pre-commit>=3.5

  # --- Notebooks ---
  - jupyter>=1.0
  - ipykernel>=6.25
  - matplotlib>=3.8

  # --- Frontend ---
  - streamlit>=1.28
  - plotly>=5.17

  # --- pip-only packages (not on conda-forge or better via pip) ---
  - pip:
      - grpcio>=1.59
      - grpcio-tools>=1.59
      - alembic>=1.12
      - dash>=2.14
