[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"



[project]
name = "quantlib-pricing"
version = "0.1.0"
description = "Full-stack quantitative finance pricing platform built on QuantLib"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [    
    # Pinned exactly; keep in sync with environment.yml (conda: quantlib-python==1.43).
    # 1.43 is required for correct overnight-coupon accrual on holiday start dates.
    "QuantLib==1.43",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "openpyxl>=3.1",           # IRS Excel trade inputs (services/irs_inputs/excel_reader.py)
    "pydantic>=2.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "grpcio>=1.59",
    "grpcio-tools>=1.59",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=23.2",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.82",
    "ruff>=0.1",
    "mypy>=1.6",
    "black>=23.9",
    "pre-commit>=3.5",
    "ipykernel>=6.25",
    "jupyter>=1.0",
]
frontend = [
    "streamlit>=1.28",
    "plotly>=5.17",
    "dash>=2.14",
]
all = ["quantlib-pricing[dev,frontend]"]

[tool.setuptools.packages.find]
include = [
    "core*", "instruments*", "engines*", "models*", "market*",
    "numerics*", "services*", "registry*", "workflows*",
    "data*", "api*", "reporting*", "infra*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]                  # ← add this line

# Validation-phase tests (they read the Bloomberg fixtures in tests/fixtures/bloomberg_irs and
# compare Optima with Bloomberg) are excluded by default; run them with `pytest -m validation`.
addopts = "-v --tb=short --strict-markers -m 'not validation'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "regression: known-good pricing regression tests",
    "integration: cross-module integration tests",
    "validation: validation-phase Optima-vs-Bloomberg tests (excluded by default)",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
